<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

    <title>House Price Predictor</title>
  </head>
  <body class="bg-dark">
    <div class="container">
        <div class="row">
            <div class="card" style="width: 100%; height: 100%; margin-top:50px">
                <div class="card-header" style="text-align: center">
                    <h1>Welcome to House Price Predictor</h1>
                </div>

                <div class="card-body">
                    <form method="post" accept-charset="utf-8">

                        <div class="row">

                            <div class="col-md-6 form-group" style="text-align: center">
                                <label for="location"><b>Select the Location:</b></label>
                                <select class="selectpicker form-control" id="location" name="location" required>
                                    {% for location in locations %}
                                    <option value="{{location}}">{{location}}</option>
                                    {% endfor %}
                                </select>
                            </div>


                            <div class="col-md-6 form-group" style="text-align: center">
                                <label for="bhk"><b>Enter BHK:</b></label>
                                <input type="text" class="form-control" id="bhk" name="bhk" placeholder="Enter BHK">
                            </div>


                            <div class="col-md-6 form-group" style="text-align: center">
                                <label for="bath"><b>Enter Number of Bathrooms:</b></label>
                                <input type="text" class="form-control" id="bath" name="bath" placeholder="Enter Number of Bathrooms">
                            </div>


                            <div class="col-md-6 form-group" style="text-align: center">
                                <label for="total_sqft"><b>Enter Square Feet:</b></label>
                                <input type="text" class="form-control" id="total_sqft" name="total_sqft" placeholder="Enter Square Feet">
                            </div>

                            <div class="col-md-12 form-group">
                            <button class="btn btn-primary form-control" onclick="send_data()">Predict Price</button>
                            </div>

                        </div>

                    </form>

                    <div class="col-md-12" style="text-align: center">
                        <h3><span id="prediction"></span></h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // we want to suppress the behavior ki submit pr click karke kisi aur html page pr jaye (jiska url we write in action)
        // we just want to send the data to predict method and display the result on that span

        function form_handler(event){
            event.preventDefault();
            //suppressed the default behavior of the form
        }

        function send_data(){
            document.querySelector('form').addEventListener("submit",form_handler);
            // using querySelector to select the form and uspr ek event listener banaya
            // so whenever submit event is triggerred on that form form_handler function execute hoga

            var fd=new FormData(document.querySelector('form'));
            var xhr=new XMLHttpRequest();
            xhr.open('POST','/predict',true);

            document.getElementById("prediction").innerHTML="Wait Predicting Price!....";

            xhr.onreadystatechange=function(){
                if(xhr.readyState==XMLHttpRequest.DONE){
                    document.getElementById('prediction').innerHTML="Prediction: ₹"+xhr.responseText;
                    // xhr.readyState ek number hota hai jo batata hai ki tumhara XMLHttpRequest kis stage pe hai
                    // 0→UNSENT, 1→OPENED, 2→HEADERS_RECEIVED, 3→LOADING, 4→DONE
                    // xhr.readyState==4 means the request is complete (DONE)
                    // ab response mil chuka hai server se, so update the span with the prediction
                }
            };
            xhr.onload=function(){};
            // xhr.onload = function(){}; ka matlab hai: jab request successfully complete ho jaaye, tab yeh function run karo. Abhi is function ke andar kuch bhi nahi likha (empty body), isliye yeh sirf ek placeholder hai — kaam karega, but kuch dikhega nahi.
            xhr.send(fd); //send the form data
        }
    </script>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
  </body>
</html>
